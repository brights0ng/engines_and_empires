plugins {
    id 'eae.mod-conventions'
}

requireMod(':paradyne-lib')

dependencies {
    // Sable is optional (plan section 2): only the sable sub-package touches it (ships' holds), and only after
    // ModList.isLoaded("sable"), so it is compiled against but never on the runtime classpath of Simple Spoilage's own
    // runs. Non-transitive: its pom pulls in a Sable build that isn't published. Its companion library (the sub-level
    // types) is inside Sable's jar at runtime.
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
}
