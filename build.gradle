// The root project is two things (split step 2b, docs/split/build-layout.md): the core mod, engines_and_empires, which
// still holds every mod not yet sliced out, and the dev aggregator, whose client, server and game test runs load every
// mod of the family. The settings every mod shares (repositories, Java, Parchment, mod metadata, JUnit, the bare game
// test run and the data run) are in the convention plugin, build-logic/src/main/groovy/eae.mod-conventions.gradle.
plugins {
    id 'eae.mod-conventions'
    id 'maven-publish'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

// The convention plugin derives the group from the mod id; the core keeps the one it has always published under.
group = mod_group_id

// The mods of the family the core compiles against and loads in every run (and the mods those require).
requireMod(':paradyne-lib')
requireMod(':meteodyne')
requireMod(':sparse-ores')
requireMod(':seismic-surveyance')
// Mods the dev runs load although the core does not require them (plan section 9: the dev runs load every mod).
loadMod(':sable-fixes')

neoForge {
    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // The dev aggregator's runs: they load every mod of the family (the convention plugin binds each one required or
    // loaded above) and run every mod's game tests. The bare game test run and the data run come from the plugin.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', allModIds()
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', allModIds()
            // Weather phase 8a (Meteodyne): a headless climatology run on a world copy (-Pmeteodyne.world=<folder under
            // run/> -Pmeteodyne.climatologyAuto="x,z;x,z" [-Pmeteodyne.climatologyDays=72]); the server stops when it is
            // done.
            if (project.hasProperty('meteodyne.world')) {
                programArguments.addAll '--world', project.property('meteodyne.world').toString()
            }
            ['meteodyne.climatologyAuto', 'meteodyne.climatologyDays', 'meteodyne.legacy8b'].each { key ->
                if (project.hasProperty(key)) {
                    systemProperty key, project.property(key).toString()
                }
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        // The aggregate game test run: the core's own run already loads every mod; it runs every mod's game tests.
        gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces', allModIds()
            // Weather phase 8a (Meteodyne): the headless climatology year (gametest/ClimatologyDiagnosticRun), off unless
            // asked for.
            ['meteodyne.climatologyDays', 'meteodyne.climatologyX', 'meteodyne.climatologyZ'].each { key ->
                if (project.hasProperty(key)) {
                    systemProperty key, project.property(key).toString()
                }
            }
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

// MineColonies and its libraries run in the client, server and game test runs, but not the Data run: Domum Ornamentum's
// data generator needs a library it does not ship, and crashes it.
// They can't go through a run's additionalRuntimeClasspath: that puts jars on the legacy classpath, where FML doesn't
// look for mods (MineColonies silently never loaded that way). Instead they are synced into run/mods before those runs
// launch, and the Data run uses its own folder, run-data/. run/mods is managed by Gradle: anything else put there is
// removed on the next launch.
configurations {
    colonyRuntime
    // Mods that must load from run/mods, like a real install, for the client run only: Sodium 0.8's Modrinth jar is a
    // wrapper with the real mod nested inside, and on the dev classpath FML picks the empty wrapper (2026-10-12: Iris's
    // Sodium mixins found no Sodium classes and the client died on launch).
    shaderRuntime
}
def prepareColonyMods = tasks.register("prepareColonyMods", Sync) {
    from(configurations.colonyRuntime)
    from(fileTree("libs") { include "*.jar" })
    into("run/mods")
    // run/mods is shared with prepareClientMods, which adds Iris and Sodium; Gradle doesn't notice the other task
    // rewrote it and calls this one up to date, so the server and game test runs launched with Sodium and died on a
    // missing LWJGL (2026-10-12). Always sync.
    outputs.upToDateWhen { false }
}

// Standard client run: the MineColonies jars plus the jars at the top of libs/ (Serene Seasons and GlitchCore, which
// aren't on a Gradle-friendly maven). The server and game test runs keep using prepareColonyMods, so syncing run/mods
// for them takes the libs/ jars back out. Only top-level jars are copied; subfolders of libs/ are ignored.
def prepareClientMods = tasks.register("prepareClientMods", Sync) {
    from(configurations.colonyRuntime)
    from(configurations.shaderRuntime)
    from(fileTree("libs") { include "*.jar" })
    into("run/mods")
    outputs.upToDateWhen { false }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JUnit comes from the convention plugin.
    // The ore refining tests read the recipes the mod builds as JSON (Minecraft ships this same Gson).
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // Create and the libraries it needs. See https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Create: Diesel Generators
    implementation("maven.modrinth:create-diesel-generators:${diesel_generators_version}")

    // Create Aeronautics. Non-transitive like Create: their poms pull in JEI, Curios, CC:Tweaked and a
    // Sable build that isn't published. Sable carries Veil and its physics natives inside its own jar.
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    implementation("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }
    implementation("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }
    implementation("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }
    // Sable's companion library (Pose3d, bounding boxes, JOML helpers). Sable carries it inside its own jar at runtime;
    // the wind push (weather/wind) needs it to compile.
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }

    // Encumbered (player carry weight). Referenced by project id because its Modrinth slug has brackets in it.
    // The core mod replaces its item weight lookup with ours (see the weight package).
    implementation("maven.modrinth:TgzFvqFZ:${encumbered_version}")

    // AppleSkin (food value previews). Optional: food/client/AppleSkinCompat shows spoiled food's real values in it, and
    // is only hooked up when AppleSkin is present.
    compileOnly("maven.modrinth:appleskin:${appleskin_version}")
    localRuntime("maven.modrinth:appleskin:${appleskin_version}")

    // Diet - AppleSeed Edition (nutrition). Optional: food/compat/DietCompat makes spoiled food feed it less, and the
    // core mod's data (data/engines_and_empires/diet/groups) sets the pack's group effects. CloudWorks API is Diet's own
    // required library, only needed at runtime.
    compileOnly("maven.modrinth:diet-appleseed-edition:${diet_version}")
    localRuntime("maven.modrinth:diet-appleseed-edition:${diet_version}")
    localRuntime("maven.modrinth:cloudworks-api:${cloudworks_version}")

    // MineColonies: its guards count toward Civilized land (frontier/guard/MineColoniesGuards, loaded only when it is
    // present). It and the four libraries it needs, straight from CurseForge by file id; see gradle.properties.
    compileOnly("curse.maven:minecolonies-245506:${minecolonies_file}")
    colonyRuntime("curse.maven:minecolonies-245506:${minecolonies_file}")
    colonyRuntime("curse.maven:structurize-298744:${structurize_file}")
    colonyRuntime("curse.maven:blockui-522992:${blockui_file}")
    colonyRuntime("curse.maven:multipiston-303278:${multipiston_file}")
    colonyRuntime("curse.maven:domum-ornamentum-527361:${domum_ornamentum_file}")

    // Guard Villagers: its guards are in the guards tag. Only needed at runtime (we refer to it by id only).
    localRuntime("maven.modrinth:guard-villagers:${guard_villagers_version}")

    // Deeper and Darker: its mobs are in the deep rosters and the provoked_from_below tag. Runtime only, by id only.
    localRuntime("maven.modrinth:deeperdarker:${deeper_darker_version}")

    // Cold Sweat (player temperature). Optional: the core mod's air temperature becomes its world temperature
    // (weather phase 8d, weather/climate/compat/ColdSweatCompat, only hooked up when it is installed).
    compileOnly("maven.modrinth:cold-sweat:${cold_sweat_version}")
    localRuntime("maven.modrinth:cold-sweat:${cold_sweat_version}")

    // Iris and Sodium: shader packs in the dev client (the pack ships them from Modrinth), loaded from run/mods (see
    // shaderRuntime). Meteodyne's clouds compile against Iris (compat/iris/IrisCompat), so Meteodyne declares them
    // (split step 2c) and offers them to this client run.
    shaderRuntime(project(path: ':meteodyne', configuration: 'shaderRuntimeElements'))
    // GlitchCore 2.1.0.2, Serene Seasons' library, for the client run only (synced into run/mods like Iris and Sodium).
    shaderRuntime("maven.modrinth:glitchcore:S2TfWrZR") { transitive = false }

    // libs/ (git-ignored) holds Serene Seasons 10.1.0.9 for the client run.
    // The core mod compiles against Serene Seasons' API (weather/climate/compat) but only touches it when it is
    // installed; the server and game test runs go without it. Compiled against the Modrinth copy (10.1.0.9), so a
    // fresh checkout builds without libs/.
    compileOnly("maven.modrinth:serene-seasons:pHEgQQUE") { transitive = false }
    // Project Atmosphere was removed on 2026-10-05: the core mod now owns the weather (claude/weather-backbone-plan.md).
}

tasks.named('test') {
    // Split step 1d: ArchitectureTest reads the Java source text of every mod project, the settings file and each mod
    // project's gradle.properties (which projects there are, and which mod each one builds) and the split manifest, not
    // just the compiled classes, so a change to any of them (even a comment) must rerun the tests.
    inputs.files(allprojects.collect { p ->
        [fileTree(p.file('src/main/java')), fileTree(p.file('src/test/java')), p.file('gradle.properties')]
    }.flatten(), 'settings.gradle', 'docs/split/mod-split-manifest.csv')
            .withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('architectureSources')
}

// Hooked to both the Gradle run tasks and the prepare tasks the IDE run configurations call before launching.
tasks.matching { it.name in ["runClient", "prepareClientRun"] }.configureEach {
    dependsOn(prepareClientMods)
}
tasks.matching { it.name in ["runServer", "prepareServerRun",
                              "runGameTestServer", "prepareGameTestServerRun"] }.configureEach {
    dependsOn(prepareColonyMods)
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

/** Every mod id the aggregator's runs load, its own first: the namespaces their game tests run in. */
String allModIds() {
    ([mod_id] + (requiredModPaths + loadedModPaths).collect { project(it).mod_id }).join(',')
}

// Every mod's jar in one folder (build/allJars), for copying into a test instance; separate jars, no jar-in-jar.
tasks.register('buildAll', Sync) {
    from(tasks.named('jar'))
    (requiredModPaths + loadedModPaths).each { from(project(it).tasks.named('jar')) }
    into(layout.buildDirectory.dir('allJars'))
}
