plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven { url = "https://maven.createmod.net" }              // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven {
        // Sable and the Simulated Project (Create Aeronautics, Offroad)
        url = "https://maven.ryanhcode.dev/releases"
        content {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
            includeGroup("dev.ryanhcode.offroad")
            includeGroup("dev.simulated_team.simulated")
            includeGroup("dev.eriksonn.aeronautics")
        }
    }
    exclusiveContent {
        // Modrinth is the only place maven.modrinth artifacts are looked up (and only they are looked up there)
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }// Registrate
    maven {
        // CurseForge files (MineColonies and its libraries publish there)
        url = "https://cursemaven.com"
        content {
            includeGroup("curse.maven")
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Weather phase 8a: a headless climatology run on a world copy (-Peae.world=<folder under run/>
            // -Peae.climatologyAuto="x,z;x,z" [-Peae.climatologyDays=72]); the server stops when it is done.
            if (project.hasProperty('eae.world')) {
                programArguments.addAll '--world', project.property('eae.world').toString()
            }
            ['eae.climatologyAuto', 'eae.climatologyDays', 'eae.legacy8b'].each { key ->
                if (project.hasProperty(key)) {
                    systemProperty key, project.property(key).toString()
                }
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Weather phase 8a: the headless climatology year (gametest/ClimatologyDiagnosticRun), off unless asked for.
            ['eae.climatologyDays', 'eae.climatologyX', 'eae.climatologyZ'].each { key ->
                if (project.hasProperty(key)) {
                    systemProperty key, project.property(key).toString()
                }
            }
        }

        data {
            data()
            // Its own game folder, so it never sees the MineColonies jars that prepareColonyMods puts in run/mods.
            gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// MineColonies and its libraries run in the client, server and game test runs, but not the Data run: Domum Ornamentum's
// data generator needs a library it does not ship, and crashes it.
// They can't go through a run's additionalRuntimeClasspath: that puts jars on the legacy classpath, where FML doesn't
// look for mods (MineColonies silently never loaded that way). Instead they are synced into run/mods before those runs
// launch, and the Data run uses its own folder, run-data/. run/mods is managed by Gradle: anything else put there is
// removed on the next launch.
configurations {
    colonyRuntime
    // Mods that must load from run/mods, like a real install, for the client run only: Sodium 0.8's Modrinth jar is a
    // wrapper with the real mod nested inside, and on the dev classpath FML picks the empty wrapper (2026-10-12: Iris's
    // Sodium mixins found no Sodium classes and the client died on launch).
    shaderRuntime
}
def prepareColonyMods = tasks.register("prepareColonyMods", Sync) {
    from(configurations.colonyRuntime)
    from(fileTree("libs") { include "*.jar" })
    into("run/mods")
    // run/mods is shared with prepareClientMods, which adds Iris and Sodium; Gradle doesn't notice the other task
    // rewrote it and calls this one up to date, so the server and game test runs launched with Sodium and died on a
    // missing LWJGL (2026-10-12). Always sync.
    outputs.upToDateWhen { false }
}

// Standard client run: the MineColonies jars plus the jars at the top of libs/ (Serene Seasons and GlitchCore, which
// aren't on a Gradle-friendly maven). The server and game test runs keep using prepareColonyMods, so syncing run/mods
// for them takes the libs/ jars back out. Only top-level jars are copied; subfolders of libs/ are ignored.
def prepareClientMods = tasks.register("prepareClientMods", Sync) {
    from(configurations.colonyRuntime)
    from(configurations.shaderRuntime)
    from(fileTree("libs") { include "*.jar" })
    into("run/mods")
    outputs.upToDateWhen { false }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The ore refining tests read the recipes the mod builds as JSON (Minecraft ships this same Gson).
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // Create and the libraries it needs. See https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Create: Diesel Generators
    implementation("maven.modrinth:create-diesel-generators:${diesel_generators_version}")

    // Create Aeronautics. Non-transitive like Create: their poms pull in JEI, Curios, CC:Tweaked and a
    // Sable build that isn't published. Sable carries Veil and its physics natives inside its own jar.
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    implementation("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }
    implementation("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }
    implementation("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }
    // Sable's companion library (Pose3d, bounding boxes, JOML helpers). Sable carries it inside its own jar at runtime;
    // the wind push (weather/wind) needs it to compile.
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }

    // Encumbered (player carry weight). Referenced by project id because its Modrinth slug has brackets in it.
    // The core mod replaces its item weight lookup with ours (see the weight package).
    implementation("maven.modrinth:TgzFvqFZ:${encumbered_version}")

    // AppleSkin (food value previews). Optional: food/client/AppleSkinCompat shows spoiled food's real values in it, and
    // is only hooked up when AppleSkin is present.
    compileOnly("maven.modrinth:appleskin:${appleskin_version}")
    localRuntime("maven.modrinth:appleskin:${appleskin_version}")

    // Diet - AppleSeed Edition (nutrition). Optional: food/compat/DietCompat makes spoiled food feed it less, and the
    // core mod's data (data/engines_and_empires/diet/groups) sets the pack's group effects. CloudWorks API is Diet's own
    // required library, only needed at runtime.
    compileOnly("maven.modrinth:diet-appleseed-edition:${diet_version}")
    localRuntime("maven.modrinth:diet-appleseed-edition:${diet_version}")
    localRuntime("maven.modrinth:cloudworks-api:${cloudworks_version}")

    // MineColonies: its guards count toward Civilized land (frontier/guard/MineColoniesGuards, loaded only when it is
    // present). It and the four libraries it needs, straight from CurseForge by file id; see gradle.properties.
    compileOnly("curse.maven:minecolonies-245506:${minecolonies_file}")
    colonyRuntime("curse.maven:minecolonies-245506:${minecolonies_file}")
    colonyRuntime("curse.maven:structurize-298744:${structurize_file}")
    colonyRuntime("curse.maven:blockui-522992:${blockui_file}")
    colonyRuntime("curse.maven:multipiston-303278:${multipiston_file}")
    colonyRuntime("curse.maven:domum-ornamentum-527361:${domum_ornamentum_file}")

    // Guard Villagers: its guards are in the guards tag. Only needed at runtime (we refer to it by id only).
    localRuntime("maven.modrinth:guard-villagers:${guard_villagers_version}")

    // Deeper and Darker: its mobs are in the deep rosters and the provoked_from_below tag. Runtime only, by id only.
    localRuntime("maven.modrinth:deeperdarker:${deeper_darker_version}")

    // Cold Sweat (player temperature). Optional: the core mod's air temperature becomes its world temperature
    // (weather phase 8d, weather/climate/compat/ColdSweatCompat, only hooked up when it is installed).
    compileOnly("maven.modrinth:cold-sweat:${cold_sweat_version}")
    localRuntime("maven.modrinth:cold-sweat:${cold_sweat_version}")

    // Iris and Sodium: shader packs in the dev client (the pack ships them from Modrinth), loaded from run/mods (see
    // shaderRuntime). The clouds compile against Iris (weather/cloud/client/IrisCompat), only touched when it's installed.
    compileOnly("maven.modrinth:iris:${iris_version}") { transitive = false }
    shaderRuntime("maven.modrinth:iris:${iris_version}") { transitive = false }
    shaderRuntime("maven.modrinth:sodium:${sodium_version}") { transitive = false }
    // GlitchCore 2.1.0.2, Serene Seasons' library, for the client run only (synced into run/mods like Iris and Sodium).
    shaderRuntime("maven.modrinth:glitchcore:S2TfWrZR") { transitive = false }

    // libs/ (git-ignored) holds Serene Seasons 10.1.0.9 for the client run.
    // The core mod compiles against Serene Seasons' API (weather/climate/compat) but only touches it when it is
    // installed; the server and game test runs go without it. Compiled against the Modrinth copy (10.1.0.9), so a
    // fresh checkout builds without libs/.
    compileOnly("maven.modrinth:serene-seasons:pHEgQQUE") { transitive = false }
    // Project Atmosphere was removed on 2026-10-05: the core mod now owns the weather (claude/weather-backbone-plan.md).
}

tasks.named('test') {
    useJUnitPlatform()
    // Split step 1d: ArchitectureTest reads the Java source text and the split manifest, not just the compiled classes,
    // so a change to either (even a comment) must rerun the tests.
    inputs.files(fileTree('src/main/java'), fileTree('src/test/java'), 'docs/split/mod-split-manifest.csv')
            .withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('architectureSources')
    // Weather phase 7c: the forecast skill harness runs longer offline with -Peae.harnessDays=30 (and harnessSeeds).
    ['eae.harnessDays', 'eae.harnessSeeds'].each { key ->
        if (project.hasProperty(key)) {
            systemProperty key, project.property(key)
        }
    }
}

// Hooked to both the Gradle run tasks and the prepare tasks the IDE run configurations call before launching.
tasks.matching { it.name in ["runClient", "prepareClientRun"] }.configureEach {
    dependsOn(prepareClientMods)
}
tasks.matching { it.name in ["runServer", "prepareServerRun",
                              "runGameTestServer", "prepareGameTestServerRun"] }.configureEach {
    dependsOn(prepareColonyMods)
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            simulated_version_range: simulated_version_range,
            encumbered_version_range: encumbered_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
