# Written by Gemini.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="brights0ng"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Paradyne Lib, the family's library
[[dependencies.${mod_id}]]
    modId="paradyne_lib"
    type="required"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Frontier is optional: Settled/Civilized checks require it when present.
[[dependencies.${mod_id}]]
    modId="frontier"
    type="optional"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Sparse Ores is optional: Talc registers dynamically when present.
[[dependencies.${mod_id}]]
    modId="sparse_ores"
    type="optional"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Seismic Surveyance is optional: Claim overlay is displayed on PRD/Logger maps when present.
[[dependencies.${mod_id}]]
    modId="seismic_surveyance"
    type="optional"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"
