# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.251
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Create dependency
# Versions from https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
# Create is published to its maven with a build number appended to the release version (6.0.10 -> 6.0.10-280),
# so create_version carries the build number, while create_version_range (used in neoforge.mods.toml) does not.
create_version=6.0.10-280
create_version_range=[6.0.10,6.1.0)
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
diesel_generators_version=1.21.1-1.3.15

## Create Aeronautics (the Simulated Project) and the physics library it runs on.
# Published at https://maven.ryanhcode.dev/releases as three separate mods: simulated (core), aeronautics
# (flight) and offroad (wheels, borehead bearing, rock cutting wheel). The pack ships the "bundled" jar from
# Modrinth, which is these three jar-in-jar'd. 1.3.1 is the newest on their maven (Modrinth has 1.3.2).
sable_version=2.0.5
# Sable's companion library, which Sable 2.0.5 carries inside its jar (compile only; see build.gradle).
sable_companion_version=1.6.0
simulated_version=1.3.1
simulated_version_range=[1.3.1,)

## Encumbered (player carry weight): Modrinth project TgzFvqFZ. 1.0.0 is the only 1.21.1 build.
encumbered_version=1.21.1-1.0.0
encumbered_version_range=[1.21.1-1.0.0,)

## AppleSkin 3.0.9+mc1.21 for NeoForge (Modrinth version id). Optional: spoiled food shows its real values in its previews.
appleskin_version=uAKA6Laj

## Diet - AppleSeed Edition 3.0.2 for NeoForge 1.21.1 (Modrinth version id), and CloudWorks API 1.0.4, the library it
## needs (the version Diet 3.0.2 lists on Modrinth). Optional: spoiled food feeds Diet less (food/compat/DietCompat).
diet_version=jcplwXwO
cloudworks_version=oefy0gPm

## MineColonies and its libraries, as CurseForge file ids (via cursemaven.com). MineColonies ships "snapshot" betas as its
## normal builds. minecolonies 1.1.1397-1.21.1-snapshot; structurize 1.0.832-1.21.1 (release); blockui 1.0.212-1.21.1-snapshot;
## multipiston 1.2.58-1.21.1; domum ornamentum 1.0.236-snapshot.
minecolonies_file=8957180
structurize_file=8610535
blockui_file=8883780
multipiston_file=7097877
domum_ornamentum_file=8784713

## Guard Villagers 2.4.12 for NeoForge 1.21.1 (Modrinth version id).
guard_villagers_version=JyXugpy2

## Deeper and Darker 1.4.1 for NeoForge 1.21.1 (Modrinth version id). Optional: its mobs come up around stirred deposits.
deeper_darker_version=TuD0Zvi3

## Weather: Project Atmosphere and what it needs come from libs/ (see build.gradle), not a maven.

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=engines_and_empires
# The human-readable display name for the mod.
mod_name=Engines and Empires
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=0.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=dev.brights0ng.engines_and_empires
