// Updated by ChatGPT: expose the explicitly paced larger local-air diagnostic.
// Updated by Claude: put fastutil on the unit-test runtime for the local-air capture's reader index.
plugins {
    id 'eae.mod-conventions'
}

requireMod(':paradyne-lib')
def airSceneEnabled = providers.gradleProperty('meteodyne.airScene').map { it.toBoolean() }.getOrElse(false)
def airWeatherSceneEnabled = providers.gradleProperty('meteodyne.airWeatherScene').map { it.toBoolean() }.getOrElse(false)

configurations {
    // Iris and Sodium, for testing the clouds with shader packs in the dev client (the pack ships them from Modrinth).
    // Nothing of Meteodyne's own runs uses them: the root's client run syncs them into run/mods (see the root's
    // shaderRuntime), so they are offered from here as a consumable configuration only.
    shaderRuntimeElements {
        canBeConsumed = true
        canBeResolved = false
    }
}

dependencies {
    // Sable is optional (plan section 2): only the sable sub-package touches it, and only after ModList.isLoaded("sable"),
    // so it is compiled against but never on the runtime classpath of Meteodyne's own runs. Non-transitive: its pom
    // pulls in a Sable build that isn't published. Its companion library (Pose3d, bounding boxes) is inside Sable's jar
    // at runtime.
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }

    // Iris is optional: the clouds compile against it (compat/iris/IrisCompat), and only touch it when it's installed.
    compileOnly("maven.modrinth:iris:${iris_version}") { transitive = false }
    shaderRuntimeElements("maven.modrinth:iris:${iris_version}") { transitive = false }
    shaderRuntimeElements("maven.modrinth:sodium:${sodium_version}") { transitive = false }

    // Minecraft's own fastutil (the version HeatWorld compiles against): unit tests run without Minecraft's libraries,
    // and LocalAirGeometryCapture keeps its reader index in fastutil collections.
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.12'
}

neoForge {
    runs {
        // The bare game test run (the convention plugin's): the headless climatology year
        // (gametest/ClimatologyDiagnosticRun), off unless asked for with -Pmeteodyne.climatologyDays=...
        gameTestServer {
            if (airSceneEnabled || airWeatherSceneEnabled) {
                systemProperty 'neoforge.enabledGameTestNamespaces', 'meteodyne_air_scene'
                systemProperty 'meteodyne.airScene', airSceneEnabled.toString()
                systemProperty 'meteodyne.airWeatherScene', airWeatherSceneEnabled.toString()
                systemProperty 'meteodyne.airSceneOutput', layout.buildDirectory.dir('reports/air-scene').get().asFile.absolutePath
            }
            ['meteodyne.climatologyDays', 'meteodyne.climatologyX', 'meteodyne.climatologyZ'].each { key ->
                if (project.hasProperty(key)) {
                    systemProperty key, project.property(key).toString()
                }
            }
        }
    }
}

// The opt-in benchmark has its own template namespace so ordinary fixtures cannot mutate its world concurrently.
// Copy the existing generated empty structure; preserve its original generated content.
if (airSceneEnabled || airWeatherSceneEnabled) {
    tasks.named('processResources') {
        from('src/generated/resources/data/meteodyne/structure/gametest/empty.nbt') {
            into('data/meteodyne_air_scene/structure/gametest')
        }
    }
}

tasks.named('test') {
    // Weather phase 7c: the forecast skill harness runs longer offline with -Pmeteodyne.harnessDays=30 (and harnessSeeds).
    ['meteodyne.harnessDays', 'meteodyne.harnessSeeds'].each { key ->
        if (project.hasProperty(key)) {
            systemProperty key, project.property(key)
        }
    }
}

tasks.named('jar', Jar) {
    exclude('data/meteodyne_air_scene/**')
    // Game test code only the game tests use, left out of the release jar with the game tests themselves (convention
    // plugin): the climatology year is a @GameTestHolder, and GameTestSky is the lightning tests' open-sky helper.
    exclude('**/gametest/ClimatologyDiagnosticRun.class', '**/gametest/GameTestSky.class')
}
