// One multi-project build, one Gradle project per mod of the family (split step 2b, docs/build-layout.md).
// The root project is the core mod and the dev aggregator at the same time.
pluginManagement {
    // The shared settings live in a convention plugin built from build-logic/ (an included build).
    includeBuild('build-logic')
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'engines_and_empires'

include 'paradyne-lib'
include 'sable-fixes'
include 'meteodyne'
include 'sparse-ores'
include 'seismic-surveyance'
include 'simple-spoilage'
include 'frontier'
// Not a mod: the seven feature mods' combined game test run, without the core (split step 4b).
include 'coreless'
