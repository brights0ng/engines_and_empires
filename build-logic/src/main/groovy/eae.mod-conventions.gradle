// Shared settings for every mod in the family (split step 2b; layout in docs/build-layout.md). A mod project's
// build.gradle applies this plugin, then lists the mods it requires with requireMod(':path') and adds its outside
// dependencies; everything else is here, or in eae.family-base, which this applies (split step 4b: what a project that
// only runs mods, the core-less combined run, shares with the mods).
//
// Per-mod values come from the project's own gradle.properties (mod_id, mod_name, mod_version, mod_description);
// shared versions come from the root gradle.properties.
plugins {
    // Java, repositories, NeoForge, requireMod/loadMod and the run limit (shared with the core-less combined run).
    id 'eae.family-base'
}

// Subprojects inherit the root's properties, so a subproject whose gradle.properties forgets mod_id would silently
// become a second engines_and_empires.
if (project != rootProject && mod_id == rootProject.property('mod_id')) {
    throw new GradleException("${project.path}: mod_id is the root's (${mod_id}); set mod_id, mod_name, mod_version " +
            "and mod_description in ${project.projectDir.name}/gradle.properties")
}

version = mod_version
group = "dev.brights0ng.${mod_id.replace('_', '')}"

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// This project's own mod is built before any of its runs prepare (eae.family-base's prepareModBuilds).
prepareModBuilds(project)

neoForge {
    mods {
        // This project's own mod; requireMod and loadMod add the others its runs load.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        // The bare game test run: this mod and the mods it requires, nothing else; runs only this mod's game tests.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // This mod's data generator, writing into its own src/generated/resources.
        data {
            data()
            // Its own game folder, so it never sees the MineColonies jars that the root syncs into run/mods.
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
}

// Every mod has a neoforge.mods.toml template under src/main/templates, expanded with the same properties.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            create_version_range    : create_version_range,
            simulated_version_range : simulated_version_range,
            encumbered_version_range: encumbered_version_range,
            sable_version_range     : sable_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// The jars meant for release leave the game tests out (split step 4: the core's jar shipped 12 game test classes).
// NeoForge never runs game tests in production (GameTestHooks.isGametestEnabled), and the dev runs and
// runGameTestServer load each mod's classes folder, not its jar, so nothing that runs them changes. Only the test
// classes go: the rest of a gametest package is runtime code (Meteodyne's GameTestCalendar is an event subscriber its
// mod class registers; the lib's GameTestStructures is a data provider). A mod with helpers that only its game tests
// use excludes them in its own build.gradle.
tasks.named('jar', Jar) {
    exclude('**/*GameTests.class', '**/*GameTests$*.class')
}

