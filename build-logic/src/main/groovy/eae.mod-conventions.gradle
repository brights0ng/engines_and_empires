// Shared settings for every mod in the family (split step 2b; layout in docs/split/build-layout.md). A mod project's
// build.gradle applies this plugin, then lists the mods it requires with requireMod(':path') and adds its outside
// dependencies; everything else is here.
//
// Per-mod values come from the project's own gradle.properties (mod_id, mod_name, mod_version, mod_description);
// shared versions come from the root gradle.properties.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// Subprojects inherit the root's properties, so a subproject whose gradle.properties forgets mod_id would silently
// become a second engines_and_empires.
if (project != rootProject && mod_id == rootProject.property('mod_id')) {
    throw new GradleException("${project.path}: mod_id is the root's (${mod_id}); set mod_id, mod_name, mod_version " +
            "and mod_description in ${project.projectDir.name}/gradle.properties")
}

version = mod_version
group = "dev.brights0ng.${mod_id.replace('_', '')}"

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = "https://maven.createmod.net" }              // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" }     // Registrate
    maven {
        // Sable and the Simulated Project (Create Aeronautics, Offroad)
        url = "https://maven.ryanhcode.dev/releases"
        content {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
            includeGroup("dev.ryanhcode.offroad")
            includeGroup("dev.simulated_team.simulated")
            includeGroup("dev.eriksonn.aeronautics")
        }
    }
    exclusiveContent {
        // Modrinth is the only place maven.modrinth artifacts are looked up (and only they are looked up there)
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        // CurseForge files (MineColonies and its libraries publish there)
        url = "https://cursemaven.com"
        content {
            includeGroup("curse.maven")
        }
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Mod projects this one requires, as Gradle paths (transitively closed). Read by requireMod in the projects that require
// this one, so a mod's runs always load everything it needs.
ext.requiredModPaths = [] as LinkedHashSet
// Mod projects this one's runs load without requiring them (loadMod), as Gradle paths.
ext.loadedModPaths = [] as LinkedHashSet

/**
 * Makes every run's prepare task build a mod's classes and resources folders. The Gradle run tasks already build them
 * (their classpath carries the folders), but an IDE run configuration only calls prepare<Run>Run before launching, and
 * nothing else builds a mod this project does not compile against (the aggregator's Sable Fixes): on a fresh checkout
 * the IDE runClient failed on a missing sable-fixes/build/classes/java/main (split step 4).
 */
def prepareBuilds = { Project mod ->
    tasks.matching { it.name ==~ /prepare[A-Z]\w*Run/ }.configureEach {
        dependsOn("${mod.path}:classes", "${mod.path}:processResources")
    }
}
prepareBuilds(project)

/** Binds another project's mod to this project's runs (ModDevGradle's mods {} block), once. */
def bindMod = { Project mod ->
    if (!neoForge.mods.names.contains(mod.mod_id)) {
        neoForge.mods.create(mod.mod_id) {
            sourceSet(mod.sourceSets.main)
        }
        prepareBuilds(mod)
    }
}

/**
 * Declares that this mod requires the mod built by another project of the family: it compiles against it, and every run
 * of this project (the bare game test run, the data run) loads it, plus whatever that one requires in turn.
 * The mod <-> folder binding goes through ModDevGradle's mods {} block, not the runtime classpath, so each mod is
 * loaded from its own classes and resources folders and exactly once.
 */
ext.requireMod = { String path ->
    evaluationDependsOn(path)
    def required = project(path)
    // compileOnly, not implementation: on the runtime classpath the other mod's jar would be found as a second copy
    // of the mod next to its folders in mods {}. Test code compiles against it too.
    dependencies.add('compileOnly', required)
    dependencies.add('testImplementation', required)
    ([path] + required.requiredModPaths).each { String p ->
        if (requiredModPaths.add(p)) {
            bindMod(project(p))
        }
    }
}

/**
 * Loads another project's mod (and the mods it requires) in this project's runs without compiling against it: the dev
 * aggregator loads every mod of the family, including ones the core does not require (Sable Fixes).
 */
ext.loadMod = { String path ->
    evaluationDependsOn(path)
    def loaded = project(path)
    ([path] + loaded.requiredModPaths).each { String p ->
        if (!requiredModPaths.contains(p) && loadedModPaths.add(p)) {
            bindMod(project(p))
        }
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    mods {
        // This project's own mod; requireMod and loadMod add the others its runs load.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        // The bare game test run: this mod and the mods it requires, nothing else; runs only this mod's game tests.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // This mod's data generator, writing into its own src/generated/resources.
        data {
            data()
            // Its own game folder, so it never sees the MineColonies jars that the root syncs into run/mods.
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

// One Minecraft run at a time across the whole build: `./gradlew runGameTestServer` matches every project's run task.
def minecraftRunLimit = gradle.sharedServices.registerIfAbsent('minecraftRunLimit', dev.brights0ng.buildlogic.MinecraftRunLimit) {
    maxParallelUsages = 1
}
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer', 'runData'] }.configureEach {
    usesService(minecraftRunLimit)
}

// Every mod has a neoforge.mods.toml template under src/main/templates, expanded with the same properties.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            create_version_range    : create_version_range,
            simulated_version_range : simulated_version_range,
            encumbered_version_range: encumbered_version_range,
            sable_version_range     : sable_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// The jars meant for release leave the game tests out (split step 4: the core's jar shipped 12 game test classes).
// NeoForge never runs game tests in production (GameTestHooks.isGametestEnabled), and the dev runs and
// runGameTestServer load each mod's classes folder, not its jar, so nothing that runs them changes. Only the test
// classes go: the rest of a gametest package is runtime code (Meteodyne's GameTestCalendar is an event subscriber its
// mod class registers; the lib's GameTestStructures is a data provider). A mod with helpers that only its game tests
// use excludes them in its own build.gradle.
tasks.named('jar', Jar) {
    exclude('**/*GameTests.class', '**/*GameTests$*.class')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
