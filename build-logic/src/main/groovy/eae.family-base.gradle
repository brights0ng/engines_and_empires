// Updated by Gemini: removed CurseMaven repository; updated by Claude: requireMod also loads the required mod's requiredRuntimeElements.
// What every project of the family's build shares, whether it builds a mod or only runs mods (split step 4b): Java,
// the repositories, NeoForge and Parchment, the helpers that bind other projects' mods to this project's runs
// (requireMod, loadMod), run logging, and one Minecraft run at a time. eae.mod-conventions applies it and adds the
// project's own mod; the core-less combined run (coreless/) applies it alone, as it builds no mod.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = "https://maven.createmod.net" }              // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" }     // Registrate
    maven {
        // Sable and the Simulated Project (Create Aeronautics, Offroad)
        url = "https://maven.ryanhcode.dev/releases"
        content {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
            includeGroup("dev.ryanhcode.offroad")
            includeGroup("dev.simulated_team.simulated")
            includeGroup("dev.eriksonn.aeronautics")
        }
    }
    exclusiveContent {
        // Modrinth is the only place maven.modrinth artifacts are looked up (and only they are looked up there)
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
}

// Mod projects this one requires, as Gradle paths (transitively closed). Read by requireMod in the projects that require
// this one, so a mod's runs always load everything it needs.
ext.requiredModPaths = [] as LinkedHashSet
// Mod projects this one's runs load without requiring them (loadMod), as Gradle paths.
ext.loadedModPaths = [] as LinkedHashSet

/**
 * Makes every run's prepare task build a mod's classes and resources folders. The Gradle run tasks already build them
 * (their classpath carries the folders), but an IDE run configuration only calls prepare<Run>Run before launching, and
 * nothing else builds a mod this project does not compile against (the aggregator's Sable Fixes): on a fresh checkout
 * the IDE runClient failed on a missing sable-fixes/build/classes/java/main (split step 4).
 */
def prepareBuilds = { Project mod ->
    tasks.matching { it.name ==~ /prepare[A-Z]\w*Run/ }.configureEach {
        dependsOn("${mod.path}:classes", "${mod.path}:processResources")
    }
}
ext.prepareModBuilds = prepareBuilds

/** Binds another project's mod to this project's runs (ModDevGradle's mods {} block), once. */
def bindMod = { Project mod ->
    if (!neoForge.mods.names.contains(mod.mod_id)) {
        neoForge.mods.create(mod.mod_id) {
            sourceSet(mod.sourceSets.main)
        }
        prepareBuilds(mod)
    }
}

/**
 * Declares that this mod requires the mod built by another project of the family: it compiles against it, and every run
 * of this project (the bare game test run, the data run) loads it, plus whatever that one requires in turn.
 * The mod <-> folder binding goes through ModDevGradle's mods {} block, not the runtime classpath, so each mod is
 * loaded from its own classes and resources folders and exactly once.
 */
ext.requireMod = { String path ->
    evaluationDependsOn(path)
    def required = project(path)
    // compileOnly, not implementation: on the runtime classpath the other mod's jar would be found as a second copy
    // of the mod next to its folders in mods {}. Test code compiles against it too.
    dependencies.add('compileOnly', required)
    dependencies.add('testImplementation', required)
    // Outside mods the required mod needs at runtime (its requiredRuntimeElements, e.g. Paradyne Lib's GeckoLib): this
    // project's runs load them too, since the mods {} binding carries only the mod's own classes and resources.
    if (required.configurations.findByName('requiredRuntimeElements') != null) {
        dependencies.add('runtimeOnly', dependencies.project(path: path, configuration: 'requiredRuntimeElements'))
    }
    ([path] + required.requiredModPaths).each { String p ->
        if (requiredModPaths.add(p)) {
            bindMod(project(p))
        }
    }
}

/**
 * Loads another project's mod (and the mods it requires) in this project's runs without compiling against it: the dev
 * aggregator loads every mod of the family, including ones the core does not require (Sable Fixes).
 */
ext.loadMod = { String path ->
    evaluationDependsOn(path)
    def loaded = project(path)
    ([path] + loaded.requiredModPaths).each { String p ->
        if (!requiredModPaths.contains(p) && loadedModPaths.add(p)) {
            bindMod(project(p))
        }
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

// One Minecraft run at a time across the whole build: `./gradlew runGameTestServer` matches every project's run task.
def minecraftRunLimit = gradle.sharedServices.registerIfAbsent('minecraftRunLimit', dev.brights0ng.buildlogic.MinecraftRunLimit) {
    maxParallelUsages = 1
}
// (A mod may have more runs of its own, such as Sparse Ores' runGameTestServerWithCreate.)
tasks.matching { it.name ==~ /run(Client|Server|GameTestServer\w*|Data)/ }.configureEach {
    usesService(minecraftRunLimit)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
