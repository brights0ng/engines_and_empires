// Builds the convention plugins: src/main/groovy/eae.mod-conventions.gradle, which every mod project applies, and
// eae.family-base.gradle, which it applies and the core-less combined run (coreless/) applies alone.
plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
}

dependencies {
    // The same ModDevGradle the real build uses; a precompiled script plugin can only apply plugins on its classpath.
    implementation 'net.neoforged:moddev-gradle:2.0.147'
}
