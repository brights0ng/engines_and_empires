modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="brights0ng"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Paradyne Lib, the family's library: the terrain probe deposits are placed against.
[[dependencies.${mod_id}]]
    modId="paradyne_lib"
    type="required"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Create (optional). Zinc deposits are made of Create's zinc ore, found by block id only, and rich zinc ore copies it
# when it is registered, so this mod loads AFTER Create when Create is there. Without Create, zinc deposits use a
# placeholder block and there is no rich zinc ore.
[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="${create_version_range}"
    ordering="AFTER"
    side="BOTH"

# Mixins: Sparse Ores' own, on vanilla classes (vanilla's ore veins off).
[[mixins]]
    config="sparse_ores.mixins.json"
