// The core-less combined run (split step 4b): the seven feature mods of the family together, without the core mod, and
// what they require (Create for Seismic Surveyance, Sable for Sable Fixes, Deeper and Darker for Frontier), nothing else.
// Bright's standing principle: every mod runs complete without the core, and the feature mods work with each other
// without it. Each mod's bare run proves the first half; this run proves the second: every feature mod's game tests,
// in one game with all the others.
//
// Since split step 4c this project is also a test-only mod, coreless_tests, never released (no jar): the game tests of
// feature mods working together that need no core code (they lived in the core until then), so they run here, without
// the core, and in the root's aggregate run, which loads this mod too. It is a mod project like the others
// (eae.mod-conventions); its game test run is the combined run, so it loads every feature mod and runs every feature
// mod's tests and its own. Its game folder is coreless/run.
plugins {
    id 'eae.mod-conventions'
}

// The feature mods its tests use, compiled against and loaded (with what each requires); Sable Fixes is only loaded.
def featureMods = [':paradyne-lib', ':sable-fixes', ':sparse-ores', ':seismic-surveyance', ':meteodyne', ':frontier',
                   ':simple-spoilage']
featureMods.findAll { it != ':sable-fixes' }.each { requireMod(it) }
loadMod(':sable-fixes')
def featureModIds = featureMods.collect { project(it).mod_id }

dependencies {
    // What the feature mods require from outside the family, as each one's own build.gradle declares it (the same
    // artifacts the root's runs load). Optional outside mods (Diesel Generators, Iris, Cold Sweat, ...) stay out, as in
    // the bare runs: they are integration, the core's business.
    // Seismic Surveyance: Create and what it brings (Ponder, Flywheel, Registrate). Non-transitive like Seismic's. The
    // tests compile against it too: Seismic's blocks are Create's kinds of block.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    // Sable Fixes: Sable (it carries Veil and its companion library inside its own jar).
    runtimeOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    // Frontier: Deeper and Darker, from Frontier's own declaration.
    runtimeOnly(project(path: ':frontier', configuration: 'requiredRuntimeElements'))
}

neoForge {
    runs {
        // Every feature mod's game tests and this mod's, no core: the namespaces are exactly the loaded mods' ids. To
        // chase a failure, -Pcoreless.namespaces=frontier,meteodyne runs only those mods' tests (all mods still load).
        gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    project.findProperty('coreless.namespaces')?.toString() ?: (featureModIds + [mod_id]).join(',')
        }
    }
}

// A test-only mod: nothing to ship (and the root's buildAll leaves it out).
tasks.named('jar') {
    enabled = false
}
